[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pingpoint-noc"
dynamic = ["version"]
description = "Self-hosted network operations centre: collect, store, visualise and alert."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nacho Pola" }, { name = "Martín Longares Gil" }]
# Ranges live here; requirements.txt and requirements-dev.txt are the locked, hashed versions compiled from them
# (see CONTRIBUTING.md). The deployment installs requirements.txt.
dependencies = [
    "pysnmp>=7",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2>=3.1.0",
    # SNMPv3 encryption (AES/DES): PySNMP 7 does not install it by itself.
    "cryptography>=42",
    # Time zone database: Windows and minimal containers do not ship one.
    "tzdata>=2026.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pip-audit>=2.7",
]
browser = ["playwright"]

[project.scripts]
pingpoint-api = "api.__main__:main"
pingpoint-alerts = "alerts.engine:main"
pingpoint-preflight = "tools.preflight:main"
pingpoint-users = "tools.manage_users:main"
pingpoint-add-device = "tools.add_device:main"

# The top-level packages are still called api, tools, storage...: this serves `pip install -e .`, not a wheel for PyPI
# (that needs one package name first; see ROADMAP.md).
[tool.setuptools]
py-modules = ["scenario"]

[tool.setuptools.packages.find]
include = ["alerts*", "api*", "collectors*", "maintenance*", "storage*", "tools*"]

[tool.setuptools.package-data]
"api.routes" = ["*.sh.in"]

[tool.setuptools.dynamic]
version = { attr = "api.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Unit tests only by default; browser tests run in their own CI job (-m browser or tests/browser).
addopts = "-q --ignore=tests/browser"

[tool.ruff]
# Conservative baseline: real bugs only (pyflakes + syntax/import errors).
line-length = 100
extend-exclude = ["web/static/app.js"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.coverage.run]
source = ["api", "alerts", "collectors", "storage", "maintenance", "tools"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
skip_empty = true
