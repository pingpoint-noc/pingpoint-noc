  <!-- Command Palette Modal (Deterministic keyboard navigation) -->
  <div id="cmd-palette-modal" class="cmd-palette-modal hidden" role="dialog" aria-modal="true" aria-label="Command Palette">
    <div class="cmd-palette-backdrop" id="cmd-palette-backdrop"></div>
    <div class="cmd-palette-box">
      <div class="cmd-palette-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="cmd-palette-input" class="cmd-palette-input" role="combobox" aria-expanded="true" aria-controls="cmd-palette-results" aria-autocomplete="list" placeholder="Search views, devices, alerts, settings and actions..." autocomplete="off" spellcheck="false">
        <kbd class="cmd-palette-esc-kbd">Esc</kbd>
      </div>
      <div id="cmd-palette-results" class="cmd-palette-results" role="listbox" aria-label="Results"></div>
      <div class="cmd-palette-footer">
        <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> Navigate</span>
        <span><kbd>&crarr;</kbd> Select</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </div>

  <!-- TV Wallboard Mode Indicator Banner -->
  <div id="tv-indicator" class="tv-indicator hidden">
    <span class="tv-indicator-dot"></span>
    <span class="tv-indicator-text">TV Wallboard Mode &middot; Rotating views &middot; Press <kbd>Esc</kbd> or <kbd>V</kbd> to exit</span>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
