# /etc/nfdump/default.conf (colector IPFIX de la practica P3; el servicio es nfdump@default)
# -w: directorio de capturas, -p: puerto UDP, -t 60: rota el fichero cada 60 s, -S 1: subcarpetas anio/mes/dia,
# -e: borra los ficheros viejos segun los limites de `nfexpire` (sin -e nada caduca y el disco acaba lleno).
# Limites, una sola vez: sudo nfexpire -r DIR; sudo nfexpire -u DIR -s 1G -t 30d  (lo que llegue antes). Ver docs/montar-contenedor.md.
options='-w /var/cache/nfdump/mikrotik -p 2055 -t 60 -S 1 -e'
