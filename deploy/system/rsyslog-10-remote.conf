$AllowedSender UDP, 127.0.0.1, 192.168.88.0/24, 192.168.89.0/24
$AllowedSender TCP, 127.0.0.1, 192.168.88.0/24, 192.168.89.0/24

# /etc/rsyslog.d/10-remote.conf (noc-host, collector)

# ---- Network inputs: syslog over UDP and TCP, port 514 ----
module(load="imudp")
module(load="imtcp")

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")

# ---- Output format: one line per message, easy to read and to parse ----
template(name="LabFormat" type="list") {
    property(name="timereported" dateFormat="rfc3339")
    constant(value=" ")
    property(name="fromhost-ip")
    constant(value=" ")
    property(name="hostname")
    constant(value=" ")
    property(name="syslogfacility-text")
    constant(value=".")
    property(name="syslogseverity-text")
    constant(value=" ")
    property(name="syslogtag")
    property(name="msg" spifno1stsp="on")
    property(name="msg" droplastlf="on")
    constant(value="\n")
}

# ---- One file per source IP address ----
template(name="PerSourceFile" type="list") {
    constant(value="/var/log/remote/")
    property(name="fromhost-ip")
    constant(value="/syslog.log")
}

# ---- What to do with messages received from the network ----
ruleset(name="remote") {
    action(type="omfile"
           dynaFile="PerSourceFile"
           template="LabFormat"
           createDirs="on"
           dirCreateMode="0750" dirGroup="adm"
           fileCreateMode="0640" fileGroup="adm")
}

